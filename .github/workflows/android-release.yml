# Release dell'app Android.
#
# Parte quando si pubblica un tag nella forma v* (es. v1.4.0):
#     git tag v1.4.0 && git push origin v1.4.0
# Compila l'APK di release, lo firma con la chiave salvata nei Secrets del
# repository e lo allega a una GitHub Release con le note generate dai commit.
#
# Secrets necessari (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    il file .jks codificato in base64
#   ANDROID_KEYSTORE_PASSWORD  password del keystore
#   ANDROID_KEY_ALIAS          alias della chiave (es. "neurologia")
#   ANDROID_KEY_PASSWORD       password della chiave
# Come crearli: vedi android/README.md.
name: Android - release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # per creare la Release e allegare l'APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla i secret di firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ]  || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KP" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret mancanti:$missing. Segui android/README.md (sezione 'Chiave di firma') e ripubblica il tag."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Versione dal tag
        id: version
        working-directory: android
        run: ./version-from-tag.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Ripristina il keystore dai secret
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compila e firma APK di release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon assembleRelease
          -PappVersionName="${{ steps.version.outputs.VERSION_NAME }}"
          -PappVersionCode="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Rinomina APK
        id: apk
        run: |
          out="neurologia-per-schemi-${{ steps.version.outputs.VERSION_NAME }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Cancella il keystore dal runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Crea la GitHub Release con l'APK allegato
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}"
          --verify-tag
          --title "Neurologia per schemi ${{ steps.version.outputs.VERSION_NAME }}"
          --generate-notes
