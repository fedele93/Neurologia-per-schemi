name: Release APK

# Crea l'APK Android firmato quando viene pushato un tag vN.N.N e lo allega
# a una GitHub Release. Il progetto Android è generato al volo da Capacitor
# a partire dai file della PWA: nel repo non c'è la cartella android/.
#
# Secret richiesti: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release-apk.yml"
      - "package.json"
      - "capacitor.config.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Versione
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${{ github.run_number }}-test" >> "$GITHUB_ENV"
          fi

      - name: Copia i file del sito in www/
        run: |
          mkdir -p www
          rsync -a ./ www/ \
            --exclude .git --exclude .github --exclude node_modules \
            --exclude www --exclude android --exclude pipeline \
            --exclude package.json --exclude package-lock.json \
            --exclude capacitor.config.json

      - name: Genera il progetto Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Icona e versione
        run: |
          res=android/app/src/main/res
          rm -f $res/mipmap-anydpi-v26/ic_launcher*.xml
          for d in $res/mipmap-*dpi; do
            cp immagini/logo-512x512.png "$d/ic_launcher.png"
            cp immagini/logo-512x512.png "$d/ic_launcher_round.png"
          done
          sed -i -E \
            -e "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" \
            -e "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" \
            android/app/build.gradle

      - name: Compila
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          unsigned=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$bt/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "NeuroSApp-$VERSION.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs "NeuroSApp-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroSApp-${{ env.VERSION }}
          path: NeuroSApp-*.apk

      - name: Pubblica la Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: NeuroSApp-*.apk
          generate_release_notes: true
